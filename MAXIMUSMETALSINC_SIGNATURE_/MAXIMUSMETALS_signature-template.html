<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email Signature Template – Maximus Metals</title>
</head>
<body style="margin:0;padding:24px;background:#ffffff;">

<!-- =====================================================================
     EMAIL SIGNATURE TEMPLATE – MAXIMUS METALS INC.
     Duplicate this file for each person and edit the "CHANGE ... HERE" fields.

     LOGO AND ICONS: hosted on GitHub (MAXIMUSMETALSINC_SIGNATURE/assets).
     ===================================================================== -->

<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <!-- ===== CHANGE LOGO URL HERE ===== -->
    <td valign="top" style="padding:4px 20px 0 0;">
      <img src="https://raw.githubusercontent.com/toolbox-turbocreativehub/MAXIMUSMETALSINC_SIGNATURE/main/MAXIMUSMETALSINC_SIGNATURE/assets/logo.png" alt="Maximus Metals Inc." width="148" height="89" style="display:block;border:0;outline:none;width:148px;height:89px;">
    </td>

    <td valign="top" style="padding:0;">
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;">

        <!-- Company -->
        <tr>
          <td style="padding:0 0 2px 0;font-family:Arial,Helvetica,sans-serif;font-size:19px;line-height:22px;font-weight:bold;letter-spacing:2px;color:#6380A8;white-space:nowrap;">
            MAXIMUS METALS INC.<span style="font-size:12px;font-weight:normal;letter-spacing:0.5px;color:#8A9AB2;">&nbsp;&nbsp;MM:CSE</span>
          </td>
        </tr>

        <!-- ================= CHANGE NAME HERE ================= -->
        <tr>
          <td style="padding:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:28px;line-height:32px;font-weight:bold;color:#1B2440;white-space:nowrap;">
            Full Name
          </td>
        </tr>

        <!-- ================= CHANGE POSITION HERE ================= -->
        <tr>
          <td style="padding:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:18px;letter-spacing:1.5px;color:#6F8098;white-space:nowrap;border-bottom:1px solid #E6E9EE;">
            POSITION TITLE
          </td>
        </tr>

        <!-- Contact -->
        <tr>
          <td style="padding:10px 0 0 0;">
            <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;">

              <!-- ===== CHANGE MOBILE HERE (text and href) ===== -->
              <tr>
                <td valign="middle" style="padding:0 10px 4px 0;width:16px;">
                  <img src="https://raw.githubusercontent.com/toolbox-turbocreativehub/MAXIMUSMETALSINC_SIGNATURE/main/MAXIMUSMETALSINC_SIGNATURE/assets/icon-phone.png" alt="" width="16" height="16" style="display:block;border:0;width:16px;height:16px;">
                </td>
                <td valign="middle" style="padding:0 0 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;color:#22304B;white-space:nowrap;">
                  <a href="tel:+000000000000" style="color:#22304B;text-decoration:none;font-weight:bold;font-size:15px;">+00 000 000 0000</a>
                </td>
              </tr>
              <!-- ===== CHANGE EMAIL HERE (text and href) ===== -->
              <tr>
                <td valign="middle" style="padding:0 10px 4px 0;width:16px;">
                  <img src="https://raw.githubusercontent.com/toolbox-turbocreativehub/MAXIMUSMETALSINC_SIGNATURE/main/MAXIMUSMETALSINC_SIGNATURE/assets/icon-mail.png" alt="" width="16" height="16" style="display:block;border:0;width:16px;height:16px;">
                </td>
                <td valign="middle" style="padding:0 0 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;color:#22304B;white-space:nowrap;">
                  <a href="mailto:name@maximusmetals.com" style="color:#22304B;text-decoration:none;">name@maximusmetals.com</a>
                </td>
              </tr>
              <!-- ===== CHANGE WEBSITE HERE (text and href) ===== -->
              <tr>
                <td valign="middle" style="padding:0 10px 4px 0;width:16px;">
                  <img src="https://raw.githubusercontent.com/toolbox-turbocreativehub/MAXIMUSMETALSINC_SIGNATURE/main/MAXIMUSMETALSINC_SIGNATURE/assets/icon-web.png" alt="" width="16" height="16" style="display:block;border:0;width:16px;height:16px;">
                </td>
                <td valign="middle" style="padding:0 0 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;color:#22304B;white-space:nowrap;">
                  <a href="https://www.maximusmetals.com" style="color:#22304B;text-decoration:none;">www.maximusmetals.com</a>
                </td>
              </tr>
              <!-- ===== CHANGE ADDRESS HERE ===== -->
              <tr>
                <td valign="middle" style="padding:0 10px 4px 0;width:16px;">
                  <img src="https://raw.githubusercontent.com/toolbox-turbocreativehub/MAXIMUSMETALSINC_SIGNATURE/main/MAXIMUSMETALSINC_SIGNATURE/assets/icon-pin.png" alt="" width="16" height="16" style="display:block;border:0;width:16px;height:16px;">
                </td>
                <td valign="middle" style="padding:0 0 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;color:#22304B;color:#6F8098;">
                  1100-1199 West Hastings Street, Vancouver, BC V6E 3T5, Canada
                </td>
              </tr>

            </table>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
